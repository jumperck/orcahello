[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orcahello-dataset-toolkit"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # InferenceSystem — audio frontend for waveform preprocessing
    "aifororcas-inference-v1",
    # Dataset building
    "datasets>=3.0.0,<4.0.0",
    "pydantic>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
]

[tool.uv.sources]
aifororcas-inference-v1 = { path = "../../InferenceSystem" }

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
