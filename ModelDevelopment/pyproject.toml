[project]
name = "orcahello-model-development"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Dataset building
    "datasets>=3.0.0,<4.0.0",
    "pydantic>=2.0.0",
    # Audio I/O (shared with InferenceSystem)
    "soundfile>=0.13.0",
    "librosa>=0.10.0",
    "numpy>=2.0.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
